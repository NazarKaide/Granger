<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебе ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Повноекранне відео */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0;
            transition: opacity 3s ease-in-out;
            filter: brightness(0.7);
        }

        /* Контейнер тексту */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 90%;
            transition: opacity 2s ease-in-out; /* Для плавного зникнення в кінці */
        }

        .typing-text {
            color: white;
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            font-family: 'Times New Roman', serif;
            font-style: italic;
            text-shadow: 0 0 20px rgba(0,0,0,1);
        }

        /* Кнопка запуску */
        #start-btn {
            position: fixed;
            z-index: 10;
            padding: 20px 40px;
            font-size: 1.5rem;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.4);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #start-btn:hover {
            transform: scale(1.15);
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: white;
            margin-left: 8px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <button id="start-btn">Відкрити валентинку ❤️</button>

    <video id="bg-video" loop>
        <source src="yasa.mp4" type="video/mp4">
    </video>

    <div class="content" style="opacity: 0;" id="main-content">
        <h1 class="typing-text"><span id="text"></span><span id="cursor" class="cursor">|</span></h1>
    </div>

    <script>
        const btn = document.getElementById('start-btn');
        const video = document.getElementById('bg-video');
        const content = document.getElementById('main-content');
        const textElement = document.getElementById('text');
        const cursor = document.getElementById('cursor');

        const phrases = [
            "Кожен момент з тобою...",
            "Це найкраще, що є в моєму житті.",
            "Дякую, що ти поруч.",
            "Я люблю тебе безмежно!",
            "Зі святом, моє сонце! ❤️"
        ];

        let pIdx = 0, cIdx = 0, isDel = false;

        function typeEffect() {
            let curr = phrases[pIdx];
            
            // Проявляємо відео на 3-й фразі (індекс 2) або коли захочеш
            if (pIdx >= 2) video.style.opacity = "1";

            textElement.textContent = isDel ? curr.substring(0, cIdx--) : curr.substring(0, cIdx++);

            let speed = isDel ? 40 : 100;

            if (!isDel && cIdx > curr.length) {
                // Перевірка: чи це остання фраза?
                if (pIdx === phrases.length - 1) {
                    setTimeout(() => {
                        content.style.opacity = "0"; // Плавне зникнення тексту
                        cursor.style.display = "none"; // Прибрати курсор
                    }, 3000);
                    return; // ЗУПИНЯЄМО скрипт тут
                }
                isDel = true;
                speed = 2500; // Пауза перед видаленням
            } else if (isDel && cIdx < 0) {
                isDel = false;
                pIdx++; // Просто переходимо до наступної
                speed = 500;
            }

            setTimeout(typeEffect, speed);
        }

        btn.addEventListener('click', () => {
            // Розгортаємо на весь екран
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }

            btn.style.display = 'none';
            content.style.opacity = '1';
            video.play();
            setTimeout(typeEffect, 1000);
        });
    </script>
</body>
</html>
